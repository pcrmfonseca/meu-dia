<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F8F6F3;
  --white:#FFFFFF;
  --card:#FFFFFF;
  --border:#EBEBEB;
  --border-mid:#E0DCDA;
  --ink:#1A1614;
  --ink-mid:#6B6460;
  --ink-light:#B0A9A6;
  --wine:#7B2D42;
  --wine-soft:#9A3D55;
  --rose:#E8919F;
  --rose-light:#F2C4CE;
  --rose-pale:#FDF0F3;
  --nude:#F5EDE5;
  --accent:#8B7355;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--ink);font-weight:300;display:flex;flex-direction:column}

.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;width:100%}

/* TOPBAR */
.topbar{padding:calc(var(--safe-top) + 14px) 1.25rem 12px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);flex-shrink:0;border-bottom:1px solid var(--border)}
.app-name{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;color:var(--ink);letter-spacing:.01em}
.app-name em{font-style:italic;color:var(--wine)}
.topbar-date{font-size:11px;color:var(--ink-light);letter-spacing:.1em;text-transform:uppercase}

/* WEEK STRIP */
.week-strip{display:flex;gap:0;background:var(--bg);padding:.6rem 1.25rem;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.week-strip::-webkit-scrollbar{display:none}
.wday{flex:1;min-width:40px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:.45rem .2rem;border-radius:10px;cursor:pointer;transition:all .18s;position:relative}
.wd-name{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);font-weight:500}
.wd-num{font-size:17px;font-weight:300;color:var(--ink-mid);font-family:'Cormorant Garamond',serif}
.wd-dot{width:4px;height:4px;border-radius:50%;background:transparent}
.wday.has-data .wd-dot{background:var(--rose)}
.wday.active{background:var(--wine);border-radius:12px}
.wday.active .wd-name{color:rgba(255,255,255,.6)}
.wday.active .wd-num{color:white;font-weight:400}
.wday.today-mark:not(.active) .wd-num{color:var(--wine);font-weight:500}
.wday.today-mark:not(.active)::after{content:'';position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--wine)}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;padding:1.1rem 1.25rem calc(var(--safe-bottom) + 68px);-webkit-overflow-scrolling:touch}

/* PANELS */
.panel{display:none}.panel.active{display:block}

/* PROGRESS RINGS */
.rings-row{display:flex;gap:1.5rem;align-items:center;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:1rem 1.25rem;margin-bottom:1rem}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:.25rem;position:relative}
svg.ring{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:3}
.ring-fill{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
.rf-tasks{stroke:var(--wine)}
.rf-habits{stroke:var(--rose)}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);text-align:center}
.ring-pct{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:500;color:var(--ink)}
.ring-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);font-weight:500}
.rings-right{flex:1;display:flex;flex-direction:column;gap:.4rem}
.ring-stat{display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--border)}
.ring-stat:last-child{border-bottom:none}
.ring-stat-label{font-size:12px;color:var(--ink-mid);letter-spacing:.03em}
.ring-stat-val{font-size:12px;color:var(--ink);font-weight:500}

/* MIT */
.mit-wrap{background:var(--wine);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1rem;position:relative;overflow:hidden}
.mit-wrap::after{content:'"';position:absolute;right:10px;top:-8px;font-size:72px;color:rgba(255,255,255,.07);font-family:'Cormorant Garamond',serif}
.mit-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:.4rem;font-weight:500}
.mit-inp{background:none;border:none;outline:none;font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:white;width:100%;font-style:italic;line-height:1.4}
.mit-inp::placeholder{color:rgba(255,255,255,.3)}
.mit-row{display:flex;align-items:center;gap:.5rem;margin-top:.6rem}
.mit-check{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;cursor:pointer;transition:all .2s;flex-shrink:0}
.mit-check.done{background:rgba(255,255,255,.9);color:var(--wine)}
.mit-sub{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.03em}

/* SECTION HEAD */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;margin-top:.1rem}
.sec-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);font-weight:500}
.sec-action{font-size:11px;color:var(--ink-light);cursor:pointer;display:flex;align-items:center;gap:.3rem}
.add-circle{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-mid);cursor:pointer;transition:all .2s}
.add-circle:hover{border-color:var(--wine);color:var(--wine)}
.divider{height:1px;background:var(--border);margin:.9rem 0}

/* TASK CARD */
.task-card{background:var(--white);border:1px solid var(--border);border-radius:13px;margin-bottom:.4rem;overflow:hidden;transition:border-color .2s}
.task-card:hover{border-color:var(--rose-light)}
.task-row{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;cursor:pointer}
.task-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .22s}
.task-card.done .task-check{background:var(--wine);border-color:var(--wine);color:white}
.task-info{flex:1;min-width:0}
.task-name{font-size:15px;color:var(--ink);line-height:1.3;font-weight:300}
.task-card.done .task-name{text-decoration:line-through;color:var(--ink-light)}
.task-time{font-size:11px;color:var(--ink-light);margin-top:2px;letter-spacing:.03em}
.task-card.done .task-time{color:var(--ink-light)}
.task-pri-dot{width:6px;height:6px;border-radius:50%;background:var(--wine);flex-shrink:0}
.task-del{background:none;border:none;cursor:pointer;color:var(--border-mid);font-size:17px;opacity:0;transition:opacity .2s;line-height:1;padding:0 2px}
.task-card:hover .task-del{opacity:1}

/* ADD TASK FORM */
.add-form{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:.85rem 1rem;margin-top:.4rem}
.add-form-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem}
.add-form-row:last-child{margin-bottom:0}
.add-inp{flex:1;background:none;border:none;outline:none;font-family:'Jost',sans-serif;font-size:14px;font-weight:300;color:var(--ink)}
.add-inp::placeholder{color:var(--ink-light)}
.time-inp{background:none;border:none;outline:none;font-family:'Jost',sans-serif;font-size:12px;color:var(--ink-mid);width:90px}
.pri-toggle{font-size:11px;padding:.25rem .65rem;border-radius:8px;border:1px solid var(--border);background:none;color:var(--ink-mid);cursor:pointer;font-family:'Jost',sans-serif;transition:all .2s}
.pri-toggle.on{background:var(--rose-pale);border-color:var(--rose-light);color:var(--wine)}
.form-add-btn{padding:.3rem .85rem;background:var(--wine);color:white;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;font-weight:500}
.form-cancel{font-size:12px;color:var(--ink-light);cursor:pointer;padding:.3rem .5rem;background:none;border:none;font-family:'Jost',sans-serif}

/* HABIT */
.habit-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.hcard{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:.8rem;display:flex;align-items:center;gap:.65rem;cursor:pointer;transition:all .2s}
.hcard:hover{border-color:var(--rose-light)}
.hcard.done{background:var(--rose-pale);border-color:var(--rose-light)}
.hcheck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-mid);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;flex-shrink:0;transition:all .22s}
.hcard.done .hcheck{background:var(--rose);border-color:var(--rose);color:white}
.hinfo{flex:1;min-width:0}
.hname{font-size:13px;color:var(--ink);font-weight:300}
.hcard.done .hname{color:var(--wine)}
.hdots{display:flex;gap:3px;margin-top:4px}
.hdot{width:5px;height:5px;border-radius:50%;background:var(--border)}
.hdot.done{background:var(--rose)}
.habit-add-row{display:flex;gap:.4rem;margin-top:.5rem}
.icon-sel{padding:.3rem .4rem;border:1px solid var(--border);border-radius:8px;background:var(--white);font-size:13px;cursor:pointer}

/* NOTES */
.note-card{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:.9rem 1rem;margin-bottom:.4rem;cursor:pointer;transition:border-color .2s}
.note-card:hover{border-color:var(--rose-light)}
.note-title{font-size:14px;font-weight:500;color:var(--ink);margin-bottom:.25rem}
.note-body{font-size:13px;color:var(--ink-mid);line-height:1.5;white-space:pre-wrap}
.note-time{font-size:10px;color:var(--ink-light);margin-top:.4rem;letter-spacing:.04em}
.note-full{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.note-full-top{padding:calc(var(--safe-top) + 14px) 1.25rem .75rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.note-full-title-inp{font-size:16px;font-weight:500;color:var(--ink);background:none;border:none;outline:none;flex:1;font-family:'Jost',sans-serif}
.note-full-actions{display:flex;gap:.75rem;align-items:center}
.note-save-btn{font-size:12px;color:var(--wine);cursor:pointer;background:none;border:none;font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.04em}
.note-close-btn{font-size:20px;color:var(--ink-light);cursor:pointer;background:none;border:none;line-height:1}
.note-body-inp{flex:1;padding:1rem 1.25rem;font-family:'Jost',sans-serif;font-size:14px;font-weight:300;color:var(--ink);background:none;border:none;outline:none;resize:none;line-height:1.7}
.note-body-inp::placeholder{color:var(--ink-light)}

/* CALENDAR */
.cal-months{display:flex;gap:0;overflow-x:auto;margin-bottom:.85rem;padding-bottom:2px}
.cal-months::-webkit-scrollbar{display:none}
.cal-month-btn{flex:0 0 auto;padding:.4rem .75rem;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);background:none;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-weight:500;border-radius:8px;transition:all .2s}
.cal-month-btn.active{background:var(--wine);color:white}
.cal-grid-wrap{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:1rem}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem}
.cal-nav-btn{background:none;border:none;font-size:18px;color:var(--ink-mid);cursor:pointer;padding:.2rem .5rem}
.cal-month-title{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--ink);font-weight:400;letter-spacing:.04em}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:.4rem}
.cal-day-name{text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);font-weight:500;padding:.3rem 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;transition:all .15s;position:relative}
.cal-cell:hover{background:var(--rose-pale)}
.cal-cell.today{background:var(--wine);border-radius:50%}
.cal-cell.selected:not(.today){background:var(--rose-pale);border-radius:50%}
.cal-cell.other-month .cal-cell-num{color:var(--ink-light);opacity:.4}
.cal-cell-num{font-size:14px;color:var(--ink);font-family:'Cormorant Garamond',serif;font-weight:400}
.cal-cell.today .cal-cell-num{color:white}
.cal-cell-dot{width:4px;height:4px;border-radius:50%;background:var(--rose);position:absolute;bottom:3px}
.cal-cell.today .cal-cell-dot{background:rgba(255,255,255,.6)}
.cal-day-tasks{margin-top:.85rem}

/* MANIFESTO */
.manif-frase-card{background:linear-gradient(135deg,var(--wine),var(--wine-soft));border-radius:16px;padding:1.2rem;margin-bottom:1rem;position:relative;overflow:hidden}
.manif-frase-card::after{content:'"';position:absolute;right:12px;top:-6px;font-size:80px;color:rgba(255,255,255,.07);font-family:'Cormorant Garamond',serif}
.mf-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:.5rem;font-weight:500}
.mf-text{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:white;line-height:1.6;font-style:italic}
.mf-actions{display:flex;gap:.5rem;margin-top:.85rem}
.mf-btn{padding:.28rem .75rem;border-radius:20px;font-size:11px;font-family:'Jost',sans-serif;cursor:pointer;transition:all .2s}
.mf-fav{border:1px solid rgba(255,255,255,.3);background:none;color:rgba(255,255,255,.7)}
.mf-fav.faved{background:rgba(255,255,255,.15);color:#FFD6E0;border-color:rgba(255,255,255,.5)}
.mf-next{border:none;background:rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
.manif-textarea{width:100%;min-height:90px;background:none;border:none;outline:none;font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--ink);line-height:1.7;resize:none;font-style:italic}
.manif-textarea::placeholder{color:var(--ink-light)}
.afirm-card{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:.8rem 1rem;margin-bottom:.38rem;display:flex;align-items:center;gap:.7rem}
.afirm-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;cursor:pointer;transition:all .22s}
.afirm-card.read .afirm-check{background:var(--rose);border-color:var(--rose);color:white}
.afirm-text{font-size:14px;flex:1;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink);line-height:1.4}
.afirm-card.read .afirm-text{color:var(--ink-light)}
.fav-card{background:var(--rose-pale);border:1px solid var(--rose-light);border-radius:13px;padding:.75rem 1rem;margin-bottom:.38rem;display:flex;align-items:flex-start;gap:.6rem}
.fav-text{font-size:13px;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--wine);flex:1;line-height:1.5}
.fav-del{background:none;border:none;cursor:pointer;color:var(--rose-light);font-size:16px;opacity:0;transition:opacity .2s}
.fav-card:hover .fav-del{opacity:1}
.tema-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.7rem}
.tema-chip{padding:.3rem .75rem;border-radius:20px;border:1px solid var(--border);background:var(--white);font-size:11px;cursor:pointer;color:var(--ink-mid);transition:all .2s;font-family:'Jost',sans-serif}
.tema-chip.active{background:var(--rose-pale);border-color:var(--rose-light);color:var(--wine);font-weight:500}
.banco-card{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:.75rem 1rem;margin-bottom:.38rem;display:flex;align-items:flex-start;gap:.65rem}
.banco-text{font-size:14px;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink);flex:1;line-height:1.5}
.banco-add{background:none;border:none;cursor:pointer;color:var(--ink-light);font-size:20px;transition:color .2s;line-height:1;flex-shrink:0}
.banco-add:hover{color:var(--wine)}

/* EMPTY */
.empty-state{text-align:center;padding:1.5rem .5rem;color:var(--ink-light);font-size:14px;font-family:'Cormorant Garamond',serif;font-style:italic}

/* ADD AREA SIMPLE */
.add-area{display:flex;gap:.4rem;margin-top:.5rem;background:var(--white);border-radius:12px;padding:.5rem .85rem;border:1px solid var(--border);transition:border-color .2s}
.add-area:focus-within{border-color:var(--rose-light)}
.add-btn{background:var(--wine);color:white;border:none;border-radius:8px;padding:.3rem .8rem;font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;font-weight:500}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(248,246,243,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom)}
.bnav-btn{flex:1;padding:.65rem 0;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);transition:color .2s}
.bnav-btn.active{color:var(--wine)}
.bnav-icon{font-size:18px;line-height:1}

@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.task-card,.hcard,.note-card,.cal-day-tasks .task-card{animation:fadeUp .2s ease both}
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div>
      <div class="app-name">meu <em>dia</em></div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <button class="nav-btn" style="width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--ink-mid);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="shiftDay(-1)">‹</button>
      <button id="day-pill" onclick="goToday()" style="font-size:10px;padding:3px 10px;border-radius:10px;background:var(--wine);color:white;font-weight:500;letter-spacing:.06em;cursor:pointer;border:none;font-family:'Jost',sans-serif">hoje</button>
      <button class="nav-btn" style="width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--ink-mid);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="shiftDay(1)">›</button>
    </div>
  </div>

  <!-- WEEK STRIP -->
  <div class="week-strip" id="week-strip"></div>

  <div class="scroll" id="scroll">

    <!-- DIA -->
    <div id="panel-day" class="panel active">

      <!-- RINGS -->
      <div class="rings-row">
        <div class="ring-item">
          <svg class="ring" width="54" height="54" viewBox="0 0 54 54">
            <circle class="ring-bg" cx="27" cy="27" r="21"/>
            <circle id="ring-tasks" class="ring-fill rf-tasks" cx="27" cy="27" r="21" stroke-dasharray="131.9" stroke-dashoffset="131.9"/>
          </svg>
          <div class="ring-center"><div class="ring-pct" id="pct-tasks">0%</div></div>
          <div class="ring-lbl">Tarefas</div>
        </div>
        <div class="ring-item">
          <svg class="ring" width="54" height="54" viewBox="0 0 54 54">
            <circle class="ring-bg" cx="27" cy="27" r="21"/>
            <circle id="ring-habits" class="ring-fill rf-habits" cx="27" cy="27" r="21" stroke-dasharray="131.9" stroke-dashoffset="131.9"/>
          </svg>
          <div class="ring-center"><div class="ring-pct" id="pct-habits">0%</div></div>
          <div class="ring-lbl">Hábitos</div>
        </div>
        <div class="rings-right">
          <div class="ring-stat"><span class="ring-stat-label">Tarefas</span><span class="ring-stat-val" id="stat-tasks">0 / 0</span></div>
          <div class="ring-stat"><span class="ring-stat-label">Hábitos</span><span class="ring-stat-val" id="stat-habits">0 / 0</span></div>
          <div class="ring-stat"><span class="ring-stat-label">MIT</span><span class="ring-stat-val" id="stat-mit">—</span></div>
        </div>
      </div>

      <!-- MIT -->
      <div class="mit-wrap" id="mit-wrap">
        <div class="mit-label">✦ prioridade do dia</div>
        <input class="mit-inp" id="mit-inp" placeholder="O que mais importa hoje?" oninput="saveMIT()">
        <div class="mit-row">
          <div class="mit-check" id="mit-check" onclick="toggleMIT()"></div>
          <span class="mit-sub" id="mit-sub">marcar como feita</span>
        </div>
      </div>

      <div class="divider"></div>

      <!-- TAREFAS -->
      <div class="sec-head">
        <span class="sec-title">Tarefas do dia</span>
        <div style="display:flex;gap:.5rem;align-items:center">
          <span id="task-count" style="font-size:11px;color:var(--ink-light)"></span>
          <div class="add-circle" onclick="toggleAddTask()">+</div>
        </div>
      </div>
      <div id="task-add-form" style="display:none;margin-bottom:.5rem">
        <div class="add-form">
          <div class="add-form-row">
            <input class="add-inp" id="task-inp" placeholder="Nome da tarefa…" onkeydown="if(event.key==='Enter')addTask()">
            <button class="pri-toggle" id="pri-toggle" onclick="togglePri()">⬆ alta</button>
          </div>
          <div class="add-form-row">
            <input class="time-inp" id="time-inp" type="time" placeholder="Horário">
            <button class="form-cancel" onclick="toggleAddTask()">cancelar</button>
            <button class="form-add-btn" onclick="addTask()">Adicionar</button>
          </div>
        </div>
      </div>
      <div id="task-list"></div>

      <div class="divider"></div>

      <!-- HÁBITOS -->
      <div class="sec-head">
        <span class="sec-title">Hábitos</span>
        <span id="habit-count" style="font-size:11px;color:var(--ink-light)"></span>
      </div>
      <div class="habit-grid" id="habit-grid"></div>
      <div class="habit-add-row" id="habit-add-row">
        <select class="icon-sel" id="habit-icon">
          <option>📖</option><option>🏃</option><option>🧘</option>
          <option>💧</option><option>🙏</option><option>📹</option>
          <option>✍️</option><option>💪</option><option>🌿</option>
          <option>🎯</option><option>📵</option><option>📊</option>
        </select>
        <input class="add-inp" id="habit-inp" placeholder="Novo hábito…" style="flex:1;border:none;outline:none;font-family:'Jost',sans-serif;font-size:13px;background:none" onkeydown="if(event.key==='Enter')addHabit()">
        <button class="add-btn" onclick="addHabit()">+</button>
      </div>

    </div><!-- /panel-day -->

    <!-- NOTAS -->
    <div id="panel-notes" class="panel">
      <div class="sec-head">
        <span class="sec-title">Notas</span>
        <div class="add-circle" onclick="openNewNote()">+</div>
      </div>
      <div id="notes-list"></div>
    </div>

    <!-- CALENDÁRIO -->
    <div id="panel-cal" class="panel">
      <div class="cal-months" id="cal-months"></div>
      <div class="cal-grid-wrap">
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="calShift(-1)">‹</button>
          <div class="cal-month-title" id="cal-title"></div>
          <button class="cal-nav-btn" onclick="calShift(1)">›</button>
        </div>
        <div class="cal-days-header" id="cal-days-header"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div id="cal-day-tasks"></div>
    </div>

    <!-- MANIFESTO -->
    <div id="panel-manif" class="panel">
      <div class="manif-frase-card">
        <div class="mf-label">✦ frase do dia</div>
        <div class="mf-text" id="mf-text"></div>
        <div class="mf-actions">
          <button class="mf-btn mf-fav" id="mf-fav-btn" onclick="toggleFraseFav()">♡ favoritar</button>
          <button class="mf-btn mf-next" onclick="proximaFrase()">outra →</button>
        </div>
      </div>

      <div class="sec-head"><span class="sec-title">Manifestação do dia</span></div>
      <div style="background:var(--white);border:1px solid var(--border);border-radius:13px;padding:1rem;margin-bottom:.5rem">
        <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);margin-bottom:.5rem;font-weight:500">Escreva como se já fosse realidade</div>
        <textarea class="manif-textarea" id="manif-textarea" placeholder="Hoje eu sou grata por… Eu já tenho… Eu me permito…" oninput="saveManif()"></textarea>
      </div>

      <div class="divider"></div>

      <div class="sec-head">
        <span class="sec-title">Minhas afirmações</span>
        <span style="font-size:11px;color:var(--ink-light)" id="afirm-count"></span>
      </div>
      <div id="afirm-list"></div>
      <div class="add-area">
        <input class="add-inp" id="afirm-inp" placeholder="Escreva sua afirmação…" onkeydown="if(event.key==='Enter')addAfirm()">
        <button class="add-btn" onclick="addAfirm()">+</button>
      </div>

      <div class="divider"></div>

      <div class="sec-head">
        <span class="sec-title">Favoritas</span>
        <span style="font-size:11px;color:var(--ink-light)" id="fav-count"></span>
      </div>
      <div id="fav-list"></div>

      <div class="divider"></div>

      <div class="sec-head"><span class="sec-title">Banco de frases</span></div>
      <div class="tema-row">
        <button class="tema-chip active" onclick="setTema('todas',this)">Todas</button>
        <button class="tema-chip" onclick="setTema('fe',this)">🙏 Fé</button>
        <button class="tema-chip" onclick="setTema('abundancia',this)">💰 Abundância</button>
        <button class="tema-chip" onclick="setTema('proposito',this)">🎯 Propósito</button>
        <button class="tema-chip" onclick="setTema('negocio',this)">🚀 Negócio</button>
      </div>
      <div id="banco-list"></div>
    </div>

  </div><!-- /scroll -->

  <!-- NOTE EDITOR (fullscreen) -->
  <div id="note-editor" class="note-full" style="display:none">
    <div class="note-full-top">
      <input class="note-full-title-inp" id="note-title-inp" placeholder="Título…">
      <div class="note-full-actions">
        <button class="note-save-btn" onclick="saveNote()">Salvar</button>
        <button class="note-close-btn" onclick="closeNote()">×</button>
      </div>
    </div>
    <textarea class="note-body-inp" id="note-body-inp" placeholder="Escreva aqui…"></textarea>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="bnav-btn active" id="bnav-day" onclick="switchView('day')">
      <span class="bnav-icon">⌂</span>Dia
    </button>
    <button class="bnav-btn" id="bnav-notes" onclick="switchView('notes')">
      <span class="bnav-icon">✎</span>Notas
    </button>
    <button class="bnav-btn" id="bnav-cal" onclick="switchView('cal')">
      <span class="bnav-icon">▦</span>Calendário
    </button>
    <button class="bnav-btn" id="bnav-manif" onclick="switchView('manif')">
      <span class="bnav-icon">✨</span>Manifesto
    </button>
  </div>
</div>

  {text:'Meu negócio é um canal de bênção — ele prospera porque eu sirvo com excelência.', tema:'negocio'},
  {text:'Eu imprimo na minha mente: meu conteúdo transforma vidas e gera riqueza genuína.', tema:'negocio'},
  {text:'As ideias certas surgem para mim no momento certo — minha mente criativa está sempre ativa.', tema:'negocio'},
  {text:'Cada ação que tomo hoje planta uma semente que minha mente subconsciente faz florescer.', tema:'negocio'},
  {text:'Eu sou uma empreendedora de sucesso — essa verdade está gravada na minha mente agora.', tema:'negocio'},
];

let S = {
  habits:[
    {name:'Leitura 30min',icon:'📖'},
    {name:'Oração',icon:'🙏'},
    {name:'Exercício',icon:'🏃'},
    {name:'Gravar conteúdo',icon:'📹'},
    {name:'Sem redes até 10h',icon:'📵'},
    {name:'Revisar Ads',icon:'📊'},
  ],
  days:{},
  notes:[],
  manifesto:{favs:[],afirms:[],dias:{}}
};

const realToday = new Date().toISOString().slice(0,10);
let viewDate = realToday;
let currentView = 'day';
let priOn = false;
let editingNoteIdx = null;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calSelectedDay = realToday;
let fraseIdx = 0;
let temaAtual = 'todas';

// ── STORAGE
async function loadState(){
  try{
    const r = await window.storage.get('pm_v4');
    if(r){ const l=JSON.parse(r.value); S={...S,...l}; }
  }catch(e){}
  if(!S.days) S.days={};
  if(!S.notes) S.notes=[];
  if(!S.manifesto) S.manifesto={favs:[],afirms:[],dias:{}};
  render();
}
async function persist(){
  try{ await window.storage.set('pm_v4',JSON.stringify(S)); }catch(e){}
}

// ── HELPERS
function getDay(dk){
  if(!S.days[dk]) S.days[dk]={tasks:[],habitsLog:{},mit:{text:'',done:false}};
  if(!S.days[dk].mit) S.days[dk].mit={text:'',done:false};
  return S.days[dk];
}
function dateAdd(dk,n){
  const d=new Date(dk+'T12:00'); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function formatLong(dk){
  const d=new Date(dk+'T12:00');
  return `${DAYS_PT[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
}
function getWeekDays(dk){
  const d=new Date(dk+'T12:00'), dow=d.getDay();
  const mon=new Date(d); mon.setDate(d.getDate()-dow+1);
  return Array.from({length:7},(_,i)=>{ const x=new Date(mon); x.setDate(mon.getDate()+i); return x.toISOString().slice(0,10); });
}
function getLast7(fromDk){
  return Array.from({length:7},(_,i)=>{ const d=new Date(fromDk+'T12:00'); d.setDate(d.getDate()-6+i); return d.toISOString().slice(0,10); });
}
function dayProgress(dk){
  const day=S.days[dk];
  if(!day) return {tDone:0,tTotal:0,hDone:0,hTotal:S.habits.length};
  return {tDone:day.tasks.filter(t=>t.done).length,tTotal:day.tasks.length,hDone:Object.values(day.habitsLog||{}).filter(Boolean).length,hTotal:S.habits.length};
}
function formatTime(t){
  if(!t) return '';
  const [h,m]=t.split(':'); const hr=parseInt(h);
  return `${hr>12?hr-12:hr||12}:${m} ${hr>=12?'PM':'AM'}`;
}

// ── TOPBAR & WEEK STRIP
function updateTopBar(){
  const isToday=viewDate===realToday, isPast=viewDate<realToday;
  document.getElementById('topbar-date').textContent=formatLong(viewDate);
  const pill=document.getElementById('day-pill');
  pill.textContent=isToday?'hoje':isPast?'passado':'futuro';
  pill.style.background=isToday?'var(--wine)':isPast?'var(--ink-light)':'var(--rose)';
  const past=viewDate<realToday;
  const addForm=document.getElementById('task-add-form');
  const habitAddRow=document.getElementById('habit-add-row');
  if(addForm) addForm.style.display='none';
  if(habitAddRow) habitAddRow.style.display=past?'none':'flex';
}
function renderWeekStrip(){
  const strip=document.getElementById('week-strip'); strip.innerHTML='';
  getWeekDays(viewDate).forEach(dk=>{
    const d=new Date(dk+'T12:00');
    const isActive=dk===viewDate, isToday=dk===realToday;
    const p=dayProgress(dk); const hasData=p.tTotal>0||p.hDone>0;
    const div=document.createElement('div');
    div.className='wday'+(isActive?' active':'')+(isToday&&!isActive?' today-mark':'')+(hasData&&!isActive?' has-data':'');
    div.onclick=()=>{viewDate=dk;renderDay();};
    div.innerHTML=`<div class="wd-name">${DAYS_S[d.getDay()]}</div><div class="wd-num">${d.getDate()}</div><div class="wd-dot"></div>`;
    strip.appendChild(div);
  });
}

// ── RINGS
function updateRings(dk){
  const p=dayProgress(dk);
  const tPct=p.tTotal?p.tDone/p.tTotal:0, hPct=p.hTotal?p.hDone/p.hTotal:0;
  document.getElementById('ring-tasks').style.strokeDashoffset=CIRC*(1-tPct);
  document.getElementById('ring-habits').style.strokeDashoffset=CIRC*(1-hPct);
  document.getElementById('pct-tasks').textContent=Math.round(tPct*100)+'%';
  document.getElementById('pct-habits').textContent=Math.round(hPct*100)+'%';
  document.getElementById('stat-tasks').textContent=p.tDone+' / '+p.tTotal;
  document.getElementById('stat-habits').textContent=p.hDone+' / '+p.hTotal;
  document.getElementById('task-count').textContent=p.tDone+' de '+p.tTotal;
  document.getElementById('habit-count').textContent=p.hDone+' de '+p.hTotal;
  const mit=getDay(dk).mit;
  document.getElementById('stat-mit').textContent=mit.text?(mit.done?'✓ feita':'pendente'):'—';
}

// ── MIT
let mitTimer;
function saveMIT(){ clearTimeout(mitTimer); mitTimer=setTimeout(()=>{ getDay(viewDate).mit.text=document.getElementById('mit-inp').value; persist(); },400); }
function toggleMIT(){
  if(viewDate<realToday) return;
  const day=getDay(viewDate); day.mit.done=!day.mit.done; persist(); restoreMIT(); updateRings(viewDate);
}
function restoreMIT(){
  const day=getDay(viewDate);
  document.getElementById('mit-inp').value=day.mit?.text||'';
  document.getElementById('mit-inp').readOnly=viewDate<realToday;
  const check=document.getElementById('mit-check'), sub=document.getElementById('mit-sub');
  if(day.mit?.done){
    check.classList.add('done'); check.textContent='✓'; sub.textContent='feita! ✨';
    document.getElementById('mit-wrap').style.background='var(--wine-soft)';
  }else{
    check.classList.remove('done'); check.textContent=''; sub.textContent='marcar como feita';
    document.getElementById('mit-wrap').style.background='var(--wine)';
  }
}

// ── TASKS
let priState = false;
function toggleAddTask(){
  const f=document.getElementById('task-add-form');
  f.style.display=f.style.display==='none'?'block':'none';
  if(f.style.display==='block') document.getElementById('task-inp').focus();
}
function togglePri(){
  priState=!priState;
  const btn=document.getElementById('pri-toggle');
  btn.className='pri-toggle'+(priState?' on':'');
  btn.textContent=priState?'⬆ alta':'⬆ alta';
}
function renderTasks(dk){
  const day=getDay(dk), past=dk<realToday;
  const el=document.getElementById('task-list'); el.innerHTML='';
  if(!day.tasks.length){
    el.innerHTML=`<div class="empty-state">${past?'Nenhuma tarefa registrada.':dk>realToday?'Nenhuma tarefa planejada ainda.':'Que tal definir as tarefas de hoje?'}</div>`;
    updateRings(dk); return;
  }
  const sorted=[...day.tasks].map((t,i)=>{return {...t,_i:i}}).sort((a,b)=>{
    if(a.pri==='alta'&&b.pri!=='alta') return -1;
    if(b.pri==='alta'&&a.pri!=='alta') return 1;
    return a.done-b.done;
  });
  sorted.forEach((t,si)=>{
    const card=document.createElement('div');
    card.className='task-card'+(t.done?' done':'');
    card.style.animationDelay=(si*.03)+'s';
    const timeStr=formatTime(t.time);
    card.innerHTML=`<div class="task-row" ${!past?`onclick="toggleTask('${dk}',${t._i})"`:''} style="${past?'cursor:default':''}">
      ${t.pri==='alta'?'<div class="task-pri-dot"></div>':''}
      <div class="task-check">${t.done?'✓':''}</div>
      <div class="task-info">
        <div class="task-name">${t.text}</div>
        ${timeStr?`<div class="task-time">${timeStr}</div>`:''}
      </div>
      ${!past?`<button class="task-del" onclick="event.stopPropagation();removeTask('${dk}',${t._i})">×</button>`:''}
    </div>`;
    el.appendChild(card);
  });
  updateRings(dk);
}
function addTask(){
  const inp=document.getElementById('task-inp'), v=inp.value.trim(); if(!v) return;
  const time=document.getElementById('time-inp').value;
  getDay(viewDate).tasks.push({text:v,done:false,pri:priState?'alta':'normal',time});
  inp.value=''; document.getElementById('time-inp').value=''; priState=false;
  document.getElementById('pri-toggle').className='pri-toggle';
  persist(); renderTasks(viewDate); toggleAddTask();
}
function toggleTask(dk,i){ getDay(dk).tasks[i].done=!getDay(dk).tasks[i].done; persist(); renderTasks(dk); }
function removeTask(dk,i){ getDay(dk).tasks.splice(i,1); persist(); renderTasks(dk); }

// ── HABITS
function renderHabits(dk){
  const day=getDay(dk), past=dk<realToday;
  const grid=document.getElementById('habit-grid'); grid.innerHTML='';
  const last7=getLast7(dk);
  S.habits.forEach((h,i)=>{
    const done=!!(day.habitsLog&&day.habitsLog[i]);
    const card=document.createElement('div');
    card.className='hcard'+(done?' done':'');
    card.style.animationDelay=(i*.04)+'s';
    if(!past) card.onclick=()=>toggleHabit(dk,i); else card.style.cursor='default';
    const dots=last7.map(dkk=>{ const d=S.days[dkk]&&S.days[dkk].habitsLog&&S.days[dkk].habitsLog[i]; return `<div class="hdot${d?' done':''}"></div>`; }).join('');
    card.innerHTML=`<div class="hcheck">${done?'✓':''}</div><div class="hinfo"><div class="hname">${h.icon} ${h.name}</div><div class="hdots">${dots}</div></div>`;
    grid.appendChild(card);
  });
}
function toggleHabit(dk,i){ const day=getDay(dk); if(!day.habitsLog) day.habitsLog={}; day.habitsLog[i]=!day.habitsLog[i]; persist(); renderHabits(dk); updateRings(dk); }
function addHabit(){ const inp=document.getElementById('habit-inp'), v=inp.value.trim(); if(!v) return; S.habits.push({name:v,icon:document.getElementById('habit-icon').value}); inp.value=''; persist(); renderHabits(viewDate); }

// ── NOTES
function renderNotes(){
  const el=document.getElementById('notes-list'); el.innerHTML='';
  if(!S.notes.length){ el.innerHTML='<div class="empty-state">Nenhuma nota ainda.<br>Toque em + para criar.</div>'; return; }
  // Group today vs earlier
  const todayNotes=S.notes.filter(n=>n.date===realToday);
  const earlierNotes=S.notes.filter(n=>n.date!==realToday);
  if(todayNotes.length){
    const lbl=document.createElement('div'); lbl.style.cssText='font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);font-weight:500;margin-bottom:.5rem;margin-top:.1rem'; lbl.textContent='Hoje'; el.appendChild(lbl);
    todayNotes.forEach(n=>{ const idx=S.notes.indexOf(n); el.appendChild(buildNoteCard(n,idx)); });
  }
  if(earlierNotes.length){
    const lbl=document.createElement('div'); lbl.style.cssText='font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);font-weight:500;margin-bottom:.5rem;margin-top:.85rem'; lbl.textContent='Anteriores'; el.appendChild(lbl);
    earlierNotes.forEach(n=>{ const idx=S.notes.indexOf(n); el.appendChild(buildNoteCard(n,idx)); });
  }
}
function buildNoteCard(n,idx){
  const card=document.createElement('div'); card.className='note-card';
  card.onclick=()=>openNote(idx);
  const d=new Date(n.ts); const timeStr=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  card.innerHTML=`<div class="note-title">${n.title||'Sem título'}</div><div class="note-body" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${n.body||''}</div><div class="note-time">${formatLong(n.date)} · ${timeStr}</div>`;
  return card;
}
function openNewNote(){ editingNoteIdx=null; document.getElementById('note-title-inp').value=''; document.getElementById('note-body-inp').value=''; document.getElementById('note-editor').style.display='flex'; document.getElementById('note-body-inp').focus(); }
function openNote(idx){ editingNoteIdx=idx; const n=S.notes[idx]; document.getElementById('note-title-inp').value=n.title||''; document.getElementById('note-body-inp').value=n.body||''; document.getElementById('note-editor').style.display='flex'; }
function saveNote(){ const title=document.getElementById('note-title-inp').value; const body=document.getElementById('note-body-inp').value; if(!title&&!body) return closeNote(); const note={title,body,date:realToday,ts:Date.now()}; if(editingNoteIdx!==null) S.notes[editingNoteIdx]=note; else S.notes.unshift(note); persist(); renderNotes(); closeNote(); }
function closeNote(){ document.getElementById('note-editor').style.display='none'; }

// ── CALENDAR
function renderCalMonths(){
  const el=document.getElementById('cal-months'); el.innerHTML='';
  MONTHS_S.forEach((m,i)=>{ const btn=document.createElement('button'); btn.className='cal-month-btn'+(i===calMonth?' active':''); btn.textContent=m; btn.onclick=()=>{ calMonth=i; renderCalGrid(); renderCalMonths(); }; el.appendChild(btn); });
}
function renderCalGrid(){
  const titleEl=document.getElementById('cal-title'); titleEl.textContent=`${MONTHS[calMonth].charAt(0).toUpperCase()+MONTHS[calMonth].slice(1)} ${calYear}`;
  const hdr=document.getElementById('cal-days-header'); hdr.innerHTML=''; DAYS_S.forEach(d=>{ const cell=document.createElement('div'); cell.className='cal-day-name'; cell.textContent=d; hdr.appendChild(cell); });
  const grid=document.getElementById('cal-grid'); grid.innerHTML='';
  const first=new Date(calYear,calMonth,1); const startDow=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  let cells=[];
  for(let i=startDow-1;i>=0;i--) cells.push({day:prevDays-i,month:calMonth-1,year:calYear,other:true});
  for(let i=1;i<=daysInMonth;i++) cells.push({day:i,month:calMonth,year:calYear,other:false});
  while(cells.length%7!==0) cells.push({day:cells.length-startDow-daysInMonth+1,month:calMonth+1,year:calYear,other:true});
  cells.forEach(c=>{
    const dk=`${c.year}-${String(c.month+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;
    const isToday=dk===realToday, isSel=dk===calSelectedDay;
    const p=dayProgress(dk); const hasData=!c.other&&(p.tTotal>0||p.hDone>0);
    const cell=document.createElement('div');
    cell.className='cal-cell'+(c.other?' other-month':'')+(isToday?' today':'')+(isSel&&!isToday?' selected':'');
    cell.innerHTML=`<div class="cal-cell-num">${c.day}</div>${hasData?'<div class="cal-cell-dot"></div>':''}`;
    cell.onclick=()=>{ calSelectedDay=dk; renderCalGrid(); renderCalDayTasks(dk); };
    grid.appendChild(cell);
  });
  renderCalDayTasks(calSelectedDay);
}
function renderCalDayTasks(dk){
  const el=document.getElementById('cal-day-tasks'); el.innerHTML='';
  const day=S.days[dk];
  if(!day||!day.tasks.length) return;
  const lbl=document.createElement('div'); lbl.style.cssText='font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);font-weight:500;margin:1rem 0 .5rem'; lbl.textContent=formatLong(dk); el.appendChild(lbl);
  day.tasks.forEach((t,i)=>{
    const card=document.createElement('div'); card.className='task-card'+(t.done?' done':''); card.style.animationDelay=(i*.03)+'s';
    const timeStr=formatTime(t.time);
    card.innerHTML=`<div class="task-row"><div class="task-check">${t.done?'✓':''}</div><div class="task-info"><div class="task-name">${t.text}</div>${timeStr?`<div class="task-time">${timeStr}</div>`:''}</div></div>`;
    el.appendChild(card);
  });
}
function calShift(n){ calMonth+=n; if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;} renderCalGrid(); renderCalMonths(); }

// ── MANIFESTO
function getFraseIdx(){ const d=new Date(viewDate+'T12:00'); return (d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())%BANCO_FRASES.length; }
function renderFraseDia(){ const f=BANCO_FRASES[fraseIdx%BANCO_FRASES.length]; document.getElementById('mf-text').textContent=f.text; const faved=(S.manifesto?.favs||[]).includes(f.text); const btn=document.getElementById('mf-fav-btn'); btn.textContent=faved?'♥ favoritada':'♡ favoritar'; btn.className='mf-btn mf-fav'+(faved?' faved':''); }
function proximaFrase(){ fraseIdx=(fraseIdx+1)%BANCO_FRASES.length; renderFraseDia(); }
function toggleFraseFav(){ if(!S.manifesto.favs) S.manifesto.favs=[]; const f=BANCO_FRASES[fraseIdx%BANCO_FRASES.length]; const pos=S.manifesto.favs.indexOf(f.text); if(pos>=0) S.manifesto.favs.splice(pos,1); else S.manifesto.favs.push(f.text); persist(); renderFraseDia(); renderFavs(); }
let manifTimer; function saveManif(){ clearTimeout(manifTimer); manifTimer=setTimeout(()=>{ if(!S.manifesto.dias) S.manifesto.dias={}; S.manifesto.dias[viewDate]=document.getElementById('manif-textarea').value; persist(); },500); }
function restoreManif(){ document.getElementById('manif-textarea').value=S.manifesto?.dias?.[viewDate]||''; }
function addAfirm(){ const inp=document.getElementById('afirm-inp'), v=inp.value.trim(); if(!v) return; if(!S.manifesto.afirms) S.manifesto.afirms=[]; S.manifesto.afirms.push({text:v,read:false}); inp.value=''; persist(); renderAfirms(); }
function toggleAfirm(i){ S.manifesto.afirms[i].read=!S.manifesto.afirms[i].read; persist(); renderAfirms(); }
function removeAfirm(i){ S.manifesto.afirms.splice(i,1); persist(); renderAfirms(); }
function renderAfirms(){ const list=document.getElementById('afirm-list'); const afirms=S.manifesto?.afirms||[]; const readCount=afirms.filter(a=>a.read).length; document.getElementById('afirm-count').textContent=readCount+' de '+afirms.length; list.innerHTML=''; if(!afirms.length){ list.innerHTML='<div class="empty-state">Escreva afirmações que resonam com você.</div>'; return; } afirms.forEach((a,i)=>{ const card=document.createElement('div'); card.className='afirm-card'+(a.read?' read':''); card.innerHTML=`<div class="afirm-check" onclick="toggleAfirm(${i})">${a.read?'✓':''}</div><span class="afirm-text">${a.text}</span><button style="background:none;border:none;cursor:pointer;color:var(--ink-light);font-size:17px;opacity:0;transition:opacity .2s" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=0" onclick="removeAfirm(${i})">×</button>`; list.appendChild(card); }); }
function removeFav(i){ S.manifesto.favs.splice(i,1); persist(); renderFavs(); renderFraseDia(); }
function renderFavs(){ const list=document.getElementById('fav-list'); const favs=S.manifesto?.favs||[]; document.getElementById('fav-count').textContent=favs.length; list.innerHTML=''; if(!favs.length){ list.innerHTML='<div class="empty-state">Favorite frases que te tocam ♥</div>'; return; } favs.forEach((f,i)=>{ const card=document.createElement('div'); card.className='fav-card'; card.innerHTML=`<span style="color:var(--rose);font-size:14px">♥</span><span class="fav-text">${f}</span><button class="fav-del" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=0" onclick="removeFav(${i})">×</button>`; list.appendChild(card); }); }
function setTema(tema,btn){ temaAtual=tema; document.querySelectorAll('.tema-chip').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderBanco(); }
function addFromBanco(text){ if(!S.manifesto.afirms) S.manifesto.afirms=[]; if(S.manifesto.afirms.some(a=>a.text===text)) return; S.manifesto.afirms.push({text,read:false}); persist(); renderAfirms(); }
function renderBanco(){ const list=document.getElementById('banco-list'); const frases=temaAtual==='todas'?BANCO_FRASES:BANCO_FRASES.filter(f=>f.tema===temaAtual); list.innerHTML=''; frases.forEach(f=>{ const card=document.createElement('div'); card.className='banco-card'; card.innerHTML=`<span class="banco-text">${f.text}</span><button class="banco-add" onclick="addFromBanco('${f.text.replace(/'/g,"\\'")}')">+</button>`; list.appendChild(card); }); }
function renderManif(){ fraseIdx=getFraseIdx(); renderFraseDia(); restoreManif(); renderAfirms(); renderFavs(); renderBanco(); }

// ── NAV
function shiftDay(n){ viewDate=dateAdd(viewDate,n); renderDay(); }
function goToday(){ viewDate=realToday; if(currentView!=='day') switchView('day'); else renderDay(); }
function switchView(v){
  currentView=v;
  ['day','notes','cal','manif'].forEach(id=>{
    document.getElementById('panel-'+id).classList.toggle('active',id===v);
    const bn=document.getElementById('bnav-'+id); if(bn) bn.classList.toggle('active',id===v);
  });
  if(v==='notes') renderNotes();
  if(v==='cal'){ renderCalMonths(); renderCalGrid(); }
  if(v==='manif') renderManif();
  document.getElementById('scroll').scrollTop=0;
}

// ── RENDER
function renderDay(){
  updateTopBar(); renderWeekStrip(); restoreMIT();
  renderTasks(viewDate); renderHabits(viewDate); updateRings(viewDate);
  document.getElementById('scroll').scrollTop=0;
  if(currentView!=='day') switchView('day');
}
function render(){ renderDay(); }
loadState();
</script>
</body>
