<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --nude:#F5EDE5;--nude-deep:#ECD8CB;--nude-mid:#D4B8A8;
  --rose:#E8919F;--rose-light:#F2C4CE;--rose-pale:#FDF0F3;
  --wine:#7B2D42;--wine-soft:#9A3D55;
  --cream:#FBF7F4;--white:#FFFFFF;
  --ink:#2E1A20;--ink-mid:#7A5A63;--ink-light:#B89BA4;
  --border:#EAD9D3;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--ink);font-weight:300;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.35}

.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;width:100%}

/* TOPBAR */
.topbar{padding:calc(var(--safe-top) + 10px) 1.1rem 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--cream);flex-shrink:0}
.topbar-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--wine);font-weight:400;line-height:1}
.topbar-date{font-size:12px;color:var(--ink-light);letter-spacing:.06em;margin-top:2px}
.day-nav{display:flex;align-items:center;gap:.4rem}
.nav-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--ink-mid);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.nav-btn:hover{border-color:var(--rose-light);color:var(--wine)}
.today-pill{font-size:10px;padding:3px 10px;border-radius:10px;background:var(--wine);color:white;font-weight:500;letter-spacing:.06em;cursor:pointer;border:none;font-family:'Jost',sans-serif}
.future-pill{font-size:10px;padding:3px 10px;border-radius:10px;background:var(--rose-pale);color:var(--rose);font-weight:500;border:none;font-family:'Jost',sans-serif}
.past-pill{font-size:10px;padding:3px 10px;border-radius:10px;background:var(--nude-deep);color:var(--ink-mid);font-weight:400;border:none;font-family:'Jost',sans-serif}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;padding:1.1rem 1.1rem calc(var(--safe-bottom) + 72px);-webkit-overflow-scrolling:touch}

/* WEEK STRIP */
.week-strip{display:flex;gap:.3rem;margin-bottom:1rem;overflow-x:auto;padding-bottom:2px}
.week-strip::-webkit-scrollbar{display:none}
.wday{flex:0 0 auto;width:42px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:all .2s}
.wday:hover{border-color:var(--rose-light)}
.wday.active{background:var(--wine);border-color:var(--wine)}
.wday.today-mark{border-color:var(--rose)}
.wday.has-data .wd-dot{background:var(--rose)}
.wd-name{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);font-weight:500}
.wday.active .wd-name{color:rgba(255,255,255,.7)}
.wd-num{font-size:14px;font-weight:400;color:var(--ink)}
.wday.active .wd-num{color:white;font-weight:500}
.wday.today-mark:not(.active) .wd-num{color:var(--wine);font-weight:500}
.wd-dot{width:5px;height:5px;border-radius:50%;background:transparent}

/* MIT */
.mit-block{background:var(--wine);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.85rem;position:relative;overflow:hidden}
.mit-block::after{content:'★';position:absolute;right:12px;top:6px;font-size:28px;color:rgba(255,255,255,.1)}
.mit-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:.35rem;font-weight:500}
.mit-inp{background:none;border:none;outline:none;font-family:'Playfair Display',serif;font-size:1.15rem;color:white;width:100%;font-style:italic}
.mit-inp::placeholder{color:rgba(255,255,255,.35)}
.mit-done-row{display:flex;align-items:center;gap:.5rem;margin-top:.55rem}
.mit-check{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;flex-shrink:0;transition:all .2s}
.mit-check.done{background:rgba(255,255,255,.9);color:var(--wine)}
.mit-done-label{font-size:12px;color:rgba(255,255,255,.55)}

/* INTENTION */
.int-row{display:flex;gap:.35rem;margin-bottom:.85rem;flex-wrap:wrap}
.int-chip{padding:.3rem .8rem;border-radius:20px;border:1px solid var(--border);background:var(--white);font-size:12px;font-family:'Jost',sans-serif;color:var(--ink-mid);cursor:pointer;transition:all .2s}
.int-chip:hover{border-color:var(--rose-light)}
.int-chip.sel{background:var(--rose-pale);border-color:var(--rose);color:var(--wine);font-weight:500}
.int-inp-wrap{flex:1;min-width:90px}
.int-free{width:100%;padding:.3rem .75rem;border-radius:20px;border:1px solid var(--border);background:var(--white);font-size:11px;font-family:'Jost',sans-serif;color:var(--ink);outline:none}
.int-free:focus{border-color:var(--rose-light)}

/* RINGS + ENERGY */
.metrics-row{display:flex;gap:1.25rem;margin-bottom:.85rem;align-items:center}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:.2rem;position:relative}
svg.ring{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--nude-deep);stroke-width:3.5}
.ring-fill{fill:none;stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
.ring-fill.r-tasks{stroke:var(--wine)}
.ring-fill.r-habits{stroke:var(--rose)}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);text-align:center}
.ring-pct{font-family:'Playfair Display',serif;font-size:13px;font-weight:500;color:var(--ink)}
.ring-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);font-weight:500}
.energy-box{flex:1;display:flex;flex-direction:column;gap:.3rem}
.energy-top{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);font-weight:500}
.e-grid{display:grid;grid-template-columns:1fr 1fr;gap:.28rem}
.e-btn{padding:.32rem .45rem;border-radius:8px;border:1px solid var(--border);background:var(--white);font-size:12px;font-family:'Jost',sans-serif;color:var(--ink-mid);cursor:pointer;transition:all .2s;text-align:center}
.e-btn:hover{border-color:var(--rose-light)}
.e-btn.sel{background:var(--rose-pale);border-color:var(--rose);color:var(--wine);font-weight:500}

/* SECTION */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem}
.sec-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--wine)}
.sec-count{font-size:11px;color:var(--ink-light)}
.divider{height:1px;background:var(--border);margin:.85rem 0}

/* ROUTINE */
.routine-row{display:flex;gap:.35rem;margin-bottom:.5rem;flex-wrap:wrap;align-items:center}
.routine-lbl{font-size:10px;color:var(--ink-light);letter-spacing:.05em}
.r-chip{padding:.28rem .7rem;border-radius:8px;border:1px solid var(--border);background:var(--white);font-size:12px;cursor:pointer;color:var(--ink-mid);transition:all .15s;font-family:'Jost',sans-serif}
.r-chip:hover{border-color:var(--rose-light);color:var(--wine)}

/* TASK */
.task-card{background:var(--white);border:1px solid var(--border);border-radius:11px;margin-bottom:.38rem;overflow:hidden;transition:border-color .2s}
.task-card:hover{border-color:var(--rose-light)}
.task-row{display:flex;align-items:center;gap:.6rem;padding:.72rem .88rem;cursor:pointer}
.check-c{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--nude-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .25s}
.task-card.done .check-c{background:var(--wine);border-color:var(--wine);color:white}
.task-card.done .task-txt{text-decoration:line-through;color:var(--ink-light)}
.task-txt{font-size:15px;flex:1;line-height:1.4}
.badge-alta{font-size:9px;padding:2px 6px;border-radius:5px;background:rgba(123,45,66,.12);color:var(--wine);font-weight:500;margin-right:2px;white-space:nowrap}
.del-btn{background:none;border:none;cursor:pointer;color:var(--nude-mid);font-size:17px;padding:0 2px;opacity:0;transition:opacity .2s;line-height:1}
.task-card:hover .del-btn{opacity:1}

/* ADD */
.add-area{display:flex;gap:.38rem;margin-top:.55rem;background:var(--nude);border-radius:10px;padding:.48rem .68rem;border:1px solid var(--border);transition:border-color .2s}
.add-area:focus-within{border-color:var(--rose-light)}
.add-inp{flex:1;background:none;border:none;outline:none;font-family:'Jost',sans-serif;font-size:14px;font-weight:300;color:var(--ink)}
.add-inp::placeholder{color:var(--ink-light)}
.add-btn{background:var(--wine);color:white;border:none;border-radius:7px;padding:.3rem .78rem;font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;font-weight:500;transition:background .2s}
.add-btn:hover{background:var(--wine-soft)}
.pri-sel,.icon-sel{padding:.3rem .45rem;border:1px solid var(--border);border-radius:7px;background:var(--white);font-size:11px;cursor:pointer;font-family:'Jost',sans-serif;color:var(--ink-mid)}

/* HABIT */
.habit-grid{display:grid;grid-template-columns:1fr 1fr;gap:.42rem}
.hcard{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:.78rem;display:flex;align-items:center;gap:.55rem;cursor:pointer;transition:all .2s;user-select:none}
.hcard:hover{border-color:var(--rose-light)}
.hcard.done{background:var(--rose-pale);border-color:var(--rose-light)}
.hcheck{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--nude-mid);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;flex-shrink:0;transition:all .25s}
.hcard.done .hcheck{background:var(--rose);border-color:var(--rose);color:white}
.hinfo{flex:1;min-width:0}
.hname{font-size:14px;font-weight:400;color:var(--ink)}
.hcard.done .hname{color:var(--wine)}
.hdots{display:flex;gap:3px;margin-top:3px}
.hdot{width:5px;height:5px;border-radius:50%;background:var(--nude-deep)}
.hdot.done{background:var(--rose)}

/* WEEKLY */
.week-overview{display:flex;flex-direction:column;gap:.45rem}
.wo-day{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:.78rem .95rem;cursor:pointer;transition:border-color .2s}
.wo-day:hover{border-color:var(--rose-light)}
.wo-today{border-color:var(--rose);background:var(--rose-pale)}
.wo-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.35rem}
.wo-name{font-size:13px;color:var(--ink)}
.wo-today .wo-name{color:var(--wine);font-weight:500}
.wo-pills{display:flex;gap:.28rem;flex-wrap:wrap}
.wp{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:500}
.wp-t{background:rgba(123,45,66,.1);color:var(--wine)}
.wp-h{background:var(--rose-pale);color:var(--rose)}
.wp-i{background:var(--nude-deep);color:var(--ink-mid)}
.wo-mit{font-size:11px;color:var(--ink-mid);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-empty{font-size:11px;color:var(--ink-light);font-style:italic}
.wo-bar{height:3px;border-radius:2px;background:var(--nude-deep);margin-top:.45rem}
.wo-bar-fill{height:100%;border-radius:2px;background:var(--wine);transition:width .4s}

/* HISTORY */
.hist-month{margin-bottom:1.3rem}
.hist-month-title{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--wine);margin-bottom:.45rem;font-style:italic}
.hist-day{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:.7rem .88rem;margin-bottom:.32rem;cursor:pointer;transition:border-color .2s;display:flex;align-items:center;gap:.65rem}
.hist-day:hover{border-color:var(--rose-light)}
.hist-day-label{flex:1}
.hist-day-name{font-size:13px;color:var(--ink)}
.hist-day-sub{font-size:11px;color:var(--ink-light);margin-top:1px;font-style:italic}
.hist-pills{display:flex;gap:.28rem;flex-wrap:wrap}
.hp{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:500}
.hp-t{background:rgba(123,45,66,.1);color:var(--wine)}
.hp-h{background:var(--rose-pale);color:var(--rose)}
.hp-e{background:var(--nude);color:var(--ink-mid)}

.empty-state{text-align:center;padding:1.5rem .5rem;color:var(--ink-light);font-size:13px;font-style:italic;font-family:'Playfair Display',serif}

/* PANELS */
.panel{display:none}.panel.active{display:block}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(251,247,244,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom)}
.bnav-btn{flex:1;padding:.68rem 0;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light);transition:color .2s}
.bnav-btn.active{color:var(--wine)}
.bnav-icon{font-size:17px;line-height:1}


/* MANIFESTAÇÃO */
.manif-card-frase{background:linear-gradient(135deg,var(--wine) 0%,var(--wine-soft) 100%);border-radius:16px;padding:1.25rem 1.25rem 1rem;position:relative;overflow:hidden}
.manif-card-frase::after{content:'"';position:absolute;right:14px;top:-4px;font-size:80px;color:rgba(255,255,255,.08);font-family:'Playfair Display',serif;line-height:1}
.manif-frase-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:.5rem;font-weight:500}
.manif-frase-text{font-family:'Playfair Display',serif;font-size:1.15rem;color:white;line-height:1.55;font-style:italic;min-height:48px}
.manif-frase-actions{display:flex;gap:.6rem;margin-top:.85rem}
.manif-fav-btn{padding:.3rem .8rem;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:none;color:rgba(255,255,255,.75);font-size:11px;cursor:pointer;font-family:'Jost',sans-serif;transition:all .2s}
.manif-fav-btn:hover,.manif-fav-btn.faved{background:rgba(255,255,255,.15);color:white;border-color:rgba(255,255,255,.6)}
.manif-fav-btn.faved{color:#FFD6E0}
.manif-next-btn{padding:.3rem .8rem;border-radius:20px;border:none;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);font-size:11px;cursor:pointer;font-family:'Jost',sans-serif;transition:all .2s}
.manif-next-btn:hover{background:rgba(255,255,255,.2)}
.manif-box{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.5rem}
.manif-box-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);margin-bottom:.5rem;font-weight:500}
.manif-textarea{width:100%;min-height:100px;background:none;border:none;outline:none;font-family:'Playfair Display',serif;font-size:15px;color:var(--ink);line-height:1.65;resize:none;font-style:italic}
.manif-textarea::placeholder{color:var(--ink-light)}
.afirm-card{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:.75rem .95rem;margin-bottom:.38rem;display:flex;align-items:center;gap:.65rem;transition:border-color .2s}
.afirm-card:hover{border-color:var(--rose-light)}
.afirm-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--nude-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;cursor:pointer;transition:all .25s}
.afirm-card.read .afirm-check{background:var(--rose);border-color:var(--rose);color:white}
.afirm-text{font-size:15px;flex:1;font-family:'Playfair Display',serif;font-style:italic;color:var(--ink);line-height:1.4}
.afirm-card.read .afirm-text{color:var(--ink-light)}
.fav-card{background:var(--rose-pale);border:1px solid var(--rose-light);border-radius:11px;padding:.75rem .95rem;margin-bottom:.38rem;display:flex;align-items:flex-start;gap:.65rem}
.fav-icon{color:var(--rose);font-size:14px;margin-top:1px}
.fav-text{font-size:12px;font-family:'Playfair Display',serif;font-style:italic;color:var(--wine);flex:1;line-height:1.5}
.fav-del{background:none;border:none;cursor:pointer;color:var(--nude-mid);font-size:16px;opacity:0;transition:opacity .2s}
.fav-card:hover .fav-del{opacity:1}
.tema-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.75rem}
.tema-chip{padding:.3rem .75rem;border-radius:20px;border:1px solid var(--border);background:var(--white);font-size:11px;cursor:pointer;color:var(--ink-mid);transition:all .2s;font-family:'Jost',sans-serif}
.tema-chip:hover{border-color:var(--rose-light)}
.tema-chip.active{background:var(--rose-pale);border-color:var(--rose);color:var(--wine);font-weight:500}
.banco-card{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:.75rem .95rem;margin-bottom:.38rem;display:flex;align-items:flex-start;gap:.65rem;transition:border-color .2s}
.banco-card:hover{border-color:var(--rose-light)}
.banco-text{font-size:14px;font-family:'Playfair Display',serif;font-style:italic;color:var(--ink);flex:1;line-height:1.5}
.banco-add-btn{background:none;border:none;cursor:pointer;color:var(--ink-light);font-size:18px;padding:0;transition:color .2s;line-height:1;flex-shrink:0;margin-top:1px}
.banco-add-btn:hover{color:var(--wine)}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.task-card,.hcard,.hist-day,.wo-day{animation:fadeUp .22s ease both}
</style>

<body>
<div class="app">

  <div class="topbar">
    <div>
      <div class="topbar-title" id="topbar-title">Meu Dia</div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
    <div class="day-nav">
      <button class="nav-btn" id="btn-prev" onclick="shiftDay(-1)">‹</button>
      <button class="today-pill" id="day-pill" onclick="goToday()">hoje</button>
      <button class="nav-btn" onclick="shiftDay(1)">›</button>
    </div>
  </div>

  <div class="scroll" id="scroll">

    <!-- DIA -->
    <div id="panel-day" class="panel active">
      <div class="week-strip" id="week-strip"></div>

      <div class="mit-block" id="mit-block">
        <div class="mit-label">✦ prioridade do dia</div>
        <input class="mit-inp" id="mit-inp" placeholder="Qual é a coisa mais importante hoje?" oninput="saveMIT()">
        <div class="mit-done-row">
          <div class="mit-check" id="mit-check" onclick="toggleMIT()"></div>
          <span class="mit-done-label" id="mit-done-label">marcar como feita</span>
        </div>
      </div>

      <div class="int-row" id="int-row">
        <button class="int-chip" onclick="setIntChip('🎯 Foco total',this)">🎯 Foco total</button>
        <button class="int-chip" onclick="setIntChip('📹 Gravar',this)">📹 Gravar</button>
        <button class="int-chip" onclick="setIntChip('✍️ Copy',this)">✍️ Copy</button>
        <button class="int-chip" onclick="setIntChip('📊 Ads',this)">📊 Ads</button>
        <button class="int-chip" onclick="setIntChip('🌿 Recarregar',this)">🌿 Recarregar</button>
        <div class="int-inp-wrap">
          <input class="int-free" id="int-free" placeholder="outra…" oninput="setIntFree(this.value)">
        </div>
      </div>

      <div class="metrics-row">
        <div class="ring-item">
          <svg class="ring" width="56" height="56" viewBox="0 0 56 56">
            <circle class="ring-bg" cx="28" cy="28" r="21"/>
            <circle id="ring-tasks" class="ring-fill r-tasks" cx="28" cy="28" r="21" stroke-dasharray="131.9" stroke-dashoffset="131.9"/>
          </svg>
          <div class="ring-center"><div class="ring-pct" id="pct-tasks">0%</div></div>
          <div class="ring-lbl">Tarefas</div>
        </div>
        <div class="ring-item">
          <svg class="ring" width="56" height="56" viewBox="0 0 56 56">
            <circle class="ring-bg" cx="28" cy="28" r="21"/>
            <circle id="ring-habits" class="ring-fill r-habits" cx="28" cy="28" r="21" stroke-dasharray="131.9" stroke-dashoffset="131.9"/>
          </svg>
          <div class="ring-center"><div class="ring-pct" id="pct-habits">0%</div></div>
          <div class="ring-lbl">Hábitos</div>
        </div>
        <div class="energy-box">
          <div class="energy-top">Como estou</div>
          <div class="e-grid" id="e-grid">
            <button class="e-btn" onclick="setEnergy(0,this)">😴 Cansada</button>
            <button class="e-btn" onclick="setEnergy(1,this)">🌸 Tranquila</button>
            <button class="e-btn" onclick="setEnergy(2,this)">✨ Animada</button>
            <button class="e-btn" onclick="setEnergy(3,this)">🔥 No pique</button>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="sec-head">
        <span class="sec-title">Tarefas</span>
        <span class="sec-count" id="task-count"></span>
      </div>
      <div class="routine-row" id="routine-row">
        <span class="routine-lbl">+ rápido:</span>
        <button class="r-chip" onclick="quickTask('📊 Revisar métricas de Ads')">📊 Ads</button>
        <button class="r-chip" onclick="quickTask('📹 Gravar conteúdo do dia')">📹 Gravar</button>
        <button class="r-chip" onclick="quickTask('✍️ Escrever copy / ideia')">✍️ Copy</button>
        <button class="r-chip" onclick="quickTask('💬 Responder mensagens')">💬 DMs</button>
        <button class="r-chip" onclick="quickTask('🚀 Planejar próximo lançamento')">🚀 Lançamento</button>
        <button class="r-chip" onclick="quickTask('🔍 Analisar criativos')">🔍 Criativos</button>
      </div>
      <div id="task-list"></div>
      <div class="add-area" id="add-task-area">
        <select class="pri-sel" id="pri-sel">
          <option value="normal">normal</option>
          <option value="alta">⬆ alta</option>
        </select>
        <input class="add-inp" id="task-inp" placeholder="Adicionar tarefa…" onkeydown="if(event.key==='Enter')addTask()">
        <button class="add-btn" onclick="addTask()">+</button>
      </div>

      <div class="divider"></div>

      <div class="sec-head">
        <span class="sec-title">Hábitos</span>
        <span class="sec-count" id="habit-count"></span>
      </div>
      <div class="habit-grid" id="habit-grid"></div>
      <div class="add-area" id="add-habit-area">
        <select class="icon-sel" id="habit-icon">
          <option>📖</option><option>🏃</option><option>🧘</option>
          <option>💧</option><option>🙏</option><option>📹</option>
          <option>✍️</option><option>💪</option><option>🌿</option>
          <option>🎯</option><option>📵</option><option>📊</option>
        </select>
        <input class="add-inp" id="habit-inp" placeholder="Novo hábito…" onkeydown="if(event.key==='Enter')addHabit()">
        <button class="add-btn" onclick="addHabit()">+</button>
      </div>
    </div>

    <!-- SEMANA -->
    <div id="panel-week" class="panel">
      <div style="margin-bottom:.75rem">
        <div style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--wine)">Visão da semana</div>
        <div style="font-size:11px;color:var(--ink-light);margin-top:2px">Toque num dia para abrir e planejar</div>
      </div>
      <div class="week-overview" id="week-overview"></div>
    </div>

    <!-- HISTÓRICO -->
    <div id="panel-hist" class="panel">
      <div id="hist-content"></div>
    </div>

    <!-- MANIFESTAÇÃO -->
    <div id="panel-manif" class="panel">

      <div class="manif-card-frase" id="frase-do-dia-card">
        <div class="manif-frase-label">✦ frase do dia</div>
        <div class="manif-frase-text" id="frase-do-dia-text"></div>
        <div class="manif-frase-actions">
          <button class="manif-fav-btn" id="frase-fav-btn" onclick="toggleFraseFav()">♡ favoritar</button>
          <button class="manif-next-btn" onclick="proximaFrase()">outra →</button>
        </div>
      </div>

      <div class="sec-head" style="margin-top:1.1rem">
        <span class="sec-title">Manifestação do dia</span>
      </div>
      <div class="manif-box">
        <div class="manif-box-label">Escreva como se já fosse realidade…</div>

      <div class="sec-head">
        <span class="sec-title">Minhas afirmações</span>
        <span class="sec-count" id="afirm-count"></span>
      </div>
      <div id="afirm-list"></div>
      <div class="add-area">
        <input class="add-inp" id="afirm-inp" placeholder="Escreva sua afirmação…" onkeydown="if(event.key==='Enter')addAfirm()">
        <button class="add-btn" onclick="addAfirm()">+</button>
      </div>

      <div class="divider"></div>

      <div class="sec-head">
        <span class="sec-title">Favoritas</span>
        <span class="sec-count" id="fav-count"></span>
      </div>
      <div id="fav-list"></div>

      <div class="divider"></div>

      <div class="sec-head"><span class="sec-title">Banco de frases</span></div>
      <div class="tema-row" id="tema-row">
        <button class="tema-chip active" onclick="setTema('todas',this)">Todas</button>
        <button class="tema-chip" onclick="setTema('fe',this)">🙏 Fé</button>
        <button class="tema-chip" onclick="setTema('abundancia',this)">💰 Abundância</button>
        <button class="tema-chip" onclick="setTema('proposito',this)">🎯 Propósito</button>
        <button class="tema-chip" onclick="setTema('negocio',this)">🚀 Negócio</button>

  </div>

  <div class="bottom-nav">
    <button class="bnav-btn active" id="bnav-day" onclick="switchView('day')">
      <span class="bnav-icon">🌸</span>Dia
    </button>
    <button class="bnav-btn" id="bnav-week" onclick="switchView('week')">
      <span class="bnav-icon">📅</span>Semana
    </button>
    <button class="bnav-btn" id="bnav-manif" onclick="switchView('manif')">
      <span class="bnav-icon">✨</span>Manifesto
    </button>
    <button class="bnav-btn" id="bnav-hist" onclick="switchView('hist')">
      <span class="bnav-icon">🕰</span>Histórico
    </button>
  </div>
</div>

<script>
const CIRC = 2 * Math.PI * 21;
const DAYS_PT  = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DAYS_S   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS   = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ENERGY_L = ['😴 Cansada','🌸 Tranquila','✨ Animada','🔥 No pique'];

let S = {
  habits:[
    {name:'Leitura 30min',icon:'📖'},
    {name:'Oração',icon:'🙏'},
    {name:'Exercício',icon:'🏃'},
    {name:'Gravar conteúdo',icon:'📹'},
    {name:'Sem redes até 10h',icon:'📵'},
    {name:'Revisar Ads',icon:'📊'},
  ],
  days:{}
};

const realToday = new Date().toISOString().slice(0,10);
let viewDate = realToday;
let currentView = 'day';

async function loadState(){
  try{
    const r = await window.storage.get('pm_v3');
    if(r){ const l=JSON.parse(r.value); S={...S,...l}; }
  }catch(e){}
  if(!S.days) S.days={};
  render();
}
async function persist(){
  try{ await window.storage.set('pm_v3',JSON.stringify(S)); }catch(e){}
}

function getDay(dk){
  if(!S.days[dk]) S.days[dk]={tasks:[],habitsLog:{},energy:null,mit:{text:'',done:false},intention:''};
  if(!S.days[dk].mit) S.days[dk].mit={text:'',done:false};
  return S.days[dk];
}
function dateAdd(dk,n){
  const d=new Date(dk+'T12:00'); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function formatLong(dk){
  const d=new Date(dk+'T12:00');
  return `${DAYS_PT[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
}
function getWeekDays(dk){
  const d=new Date(dk+'T12:00'), dow=d.getDay();
  const mon=new Date(d); mon.setDate(d.getDate()-dow+1);
  return Array.from({length:7},(_,i)=>{
    const x=new Date(mon); x.setDate(mon.getDate()+i);
    return x.toISOString().slice(0,10);
  });
}
function getLast7(fromDk){
  return Array.from({length:7},(_,i)=>{
    const d=new Date(fromDk+'T12:00'); d.setDate(d.getDate()-6+i);
    return d.toISOString().slice(0,10);
  });
}
function dayProgress(dk){
  const day=S.days[dk];
  if(!day) return {tDone:0,tTotal:0,hDone:0,hTotal:S.habits.length};
  const tTotal=day.tasks.length, tDone=day.tasks.filter(t=>t.done).length;
  const hDone=Object.values(day.habitsLog||{}).filter(Boolean).length;
  return {tDone,tTotal,hDone,hTotal:S.habits.length};
}

function updateTopBar(){
  const isToday=viewDate===realToday, isPast=viewDate<realToday, isFuture=viewDate>realToday;
  document.getElementById('topbar-title').textContent=isToday?'Meu Dia':isPast?'Dia anterior':'Planejamento';
  document.getElementById('topbar-date').textContent=formatLong(viewDate);
  const pill=document.getElementById('day-pill');
  pill.textContent=isToday?'hoje':isPast?'passado':'futuro';
  pill.className=isToday?'today-pill':isFuture?'future-pill':'past-pill';
  const past=viewDate<realToday;
  ['add-task-area','add-habit-area','routine-row'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.style.display=past?'none':'flex';
  });
  document.getElementById('mit-inp').readOnly=past;
  document.getElementById('mit-inp').style.opacity=past?'.6':'1';
  document.querySelectorAll('.int-chip,.int-free,.e-btn').forEach(el=>el.disabled=past);
}

function renderWeekStrip(){
  const strip=document.getElementById('week-strip'); strip.innerHTML='';
  getWeekDays(viewDate).forEach(dk=>{
    const d=new Date(dk+'T12:00');
    const isActive=dk===viewDate, isToday=dk===realToday;
    const p=dayProgress(dk); const hasData=p.tTotal>0||p.hDone>0;
    const div=document.createElement('div');
    div.className='wday'+(isActive?' active':'')+(isToday&&!isActive?' today-mark':'')+(hasData&&!isActive?' has-data':'');
    div.onclick=()=>{viewDate=dk;renderDay();};
    div.innerHTML=`<div class="wd-name">${DAYS_S[d.getDay()]}</div><div class="wd-num">${d.getDate()}</div><div class="wd-dot"></div>`;
    strip.appendChild(div);
  });
}

let mitTimer;
function saveMIT(){
  clearTimeout(mitTimer);
  mitTimer=setTimeout(()=>{ getDay(viewDate).mit.text=document.getElementById('mit-inp').value; persist(); },400);
}
function toggleMIT(){
  if(viewDate<realToday)return;
  const day=getDay(viewDate); day.mit.done=!day.mit.done; persist(); restoreMIT();
}
function restoreMIT(){
  const day=getDay(viewDate);
  document.getElementById('mit-inp').value=day.mit?.text||'';
  const check=document.getElementById('mit-check'), lbl=document.getElementById('mit-done-label');
  if(day.mit?.done){
    check.classList.add('done'); check.textContent='✓'; lbl.textContent='feita! ✨';
    document.getElementById('mit-block').style.background='var(--wine-soft)';
  } else {
    check.classList.remove('done'); check.textContent=''; lbl.textContent='marcar como feita';
    document.getElementById('mit-block').style.background='var(--wine)';
  }
}

function setIntChip(val,btn){
  if(viewDate<realToday)return;
  getDay(viewDate).intention=val; persist();
  document.querySelectorAll('.int-chip').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); document.getElementById('int-free').value='';
}
function setIntFree(val){
  if(viewDate<realToday)return;
  getDay(viewDate).intention=val; persist();
  document.querySelectorAll('.int-chip').forEach(b=>b.classList.remove('sel'));
}
function restoreIntention(){
  const v=getDay(viewDate).intention||'';
  document.querySelectorAll('.int-chip').forEach(b=>{b.classList.toggle('sel',b.textContent.trim()===v.trim());});
  const isChip=Array.from(document.querySelectorAll('.int-chip')).some(b=>b.classList.contains('sel'));
  document.getElementById('int-free').value=isChip?'':v;
}

function updateRings(dk){
  const p=dayProgress(dk);
  const tPct=p.tTotal?p.tDone/p.tTotal:0, hPct=p.hTotal?p.hDone/p.hTotal:0;
  document.getElementById('ring-tasks').style.strokeDashoffset=CIRC*(1-tPct);
  document.getElementById('ring-habits').style.strokeDashoffset=CIRC*(1-hPct);
  document.getElementById('pct-tasks').textContent=Math.round(tPct*100)+'%';
  document.getElementById('pct-habits').textContent=Math.round(hPct*100)+'%';
  document.getElementById('task-count').textContent=p.tDone+' de '+p.tTotal;
  document.getElementById('habit-count').textContent=p.hDone+' de '+p.hTotal;
}

function setEnergy(idx,btn){
  if(viewDate<realToday)return;
  getDay(viewDate).energy=idx; persist();
  document.querySelectorAll('.e-btn').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel');
}
function restoreEnergy(){
  const e=getDay(viewDate).energy;
  document.querySelectorAll('.e-btn').forEach(b=>b.classList.remove('sel'));
  if(e!=null){ const btns=document.querySelectorAll('.e-btn'); if(btns[e]) btns[e].classList.add('sel'); }
}

function renderTasks(dk){
  const day=getDay(dk), past=dk<realToday;
  const el=document.getElementById('task-list'); el.innerHTML='';
  if(!day.tasks.length){
    const msg=past?'Nenhuma tarefa registrada.':dk>realToday?'Nenhuma tarefa planejada ainda. Que tal já deixar algumas prontas?':'Como você quer usar seu dia hoje?';
    el.innerHTML=`<div class="empty-state">${msg}</div>`; updateRings(dk); return;
  }
  const sorted=[...day.tasks].map((t,i)=>({...t,_i:i})).sort((a,b)=>{
    if(a.pri==='alta'&&b.pri!=='alta')return -1;
    if(b.pri==='alta'&&a.pri!=='alta')return 1;
    return a.done-b.done;
  });
  sorted.forEach((t,si)=>{
    const card=document.createElement('div');
    card.className='task-card'+(t.done?' done':'');
    card.style.animationDelay=(si*.03)+'s';
    card.innerHTML=`<div class="task-row" ${!past?`onclick="toggleTask('${dk}',${t._i})"`:'style="cursor:default"'}>
      ${t.pri==='alta'?'<span class="badge-alta">alta</span>':''}
      <div class="check-c">${t.done?'✓':''}</div>
      <span class="task-txt">${t.text}</span>
      ${!past?`<button class="del-btn" onclick="event.stopPropagation();removeTask('${dk}',${t._i})">×</button>`:''}
    </div>`;
    el.appendChild(card);
  });
  updateRings(dk);
}
function addTask(){
  const inp=document.getElementById('task-inp'), v=inp.value.trim(); if(!v)return;
  getDay(viewDate).tasks.push({text:v,done:false,pri:document.getElementById('pri-sel').value});
  inp.value=''; document.getElementById('pri-sel').value='normal';
  persist(); renderTasks(viewDate);
}
function quickTask(text){
  getDay(viewDate).tasks.push({text,done:false,pri:'normal'});
  persist(); renderTasks(viewDate);
}
function toggleTask(dk,i){ getDay(dk).tasks[i].done=!getDay(dk).tasks[i].done; persist(); renderTasks(dk); }
function removeTask(dk,i){ getDay(dk).tasks.splice(i,1); persist(); renderTasks(dk); }

function renderHabits(dk){
  const day=getDay(dk), past=dk<realToday;
  const grid=document.getElementById('habit-grid'); grid.innerHTML='';
  const last7=getLast7(dk);
  S.habits.forEach((h,i)=>{
    const done=!!(day.habitsLog&&day.habitsLog[i]);
    const card=document.createElement('div');
    card.className='hcard'+(done?' done':'');
    card.style.animationDelay=(i*.04)+'s';
    if(!past) card.onclick=()=>toggleHabit(dk,i); else card.style.cursor='default';
    const dots=last7.map(dkk=>{
      const isDone=S.days[dkk]&&S.days[dkk].habitsLog&&S.days[dkk].habitsLog[i];
      return `<div class="hdot${isDone?' done':''}"></div>`;
    }).join('');
    card.innerHTML=`<div class="hcheck">${done?'✓':''}</div>
      <div class="hinfo"><div class="hname">${h.icon} ${h.name}</div><div class="hdots">${dots}</div></div>`;
    grid.appendChild(card);
  });
}
function toggleHabit(dk,i){
  const day=getDay(dk); if(!day.habitsLog) day.habitsLog={};
  day.habitsLog[i]=!day.habitsLog[i]; persist(); renderHabits(dk); updateRings(dk);
}
function addHabit(){
  const inp=document.getElementById('habit-inp'), v=inp.value.trim(); if(!v)return;
  S.habits.push({name:v,icon:document.getElementById('habit-icon').value});
  inp.value=''; persist(); renderHabits(viewDate);
}

function renderWeekOverview(){
  const el=document.getElementById('week-overview'); el.innerHTML='';
  getWeekDays(viewDate).forEach((dk,idx)=>{
    const d=new Date(dk+'T12:00'), isToday=dk===realToday, isFuture=dk>realToday;
    const p=dayProgress(dk), day=S.days[dk];
    const mit=day?.mit?.text||'', intention=day?.intention||'';
    const tPct=p.tTotal?Math.round(p.tDone/p.tTotal*100):0;
    const div=document.createElement('div');
    div.className='wo-day'+(isToday?' wo-today':'');
    div.style.animationDelay=(idx*.04)+'s';
    div.onclick=()=>{viewDate=dk;switchView('day');renderDay();};
    const pills=[
      p.tTotal?`<span class="wp wp-t">${p.tDone}/${p.tTotal} tarefas</span>`:'',
      p.hDone?`<span class="wp wp-h">${p.hDone}/${p.hTotal} hábitos</span>`:'',
      intention?`<span class="wp wp-i">${intention}</span>`:'',
    ].filter(Boolean).join('');
    const hasAny=p.tTotal||p.hDone||mit||intention;
    div.innerHTML=`<div class="wo-top">
        <div class="wo-name">${isToday?'✦ Hoje — ':''}${DAYS_PT[d.getDay()]}, ${d.getDate()}</div>
        <div class="wo-pills">${pills}</div>
      </div>
      ${mit?`<div class="wo-mit">★ ${mit}</div>`:''}
      ${!hasAny?`<div class="wo-empty">${isFuture?'toque para planejar':'sem registros'}</div>`:''}
      ${p.tTotal?`<div class="wo-bar"><div class="wo-bar-fill" style="width:${tPct}%"></div></div>`:''}`;
    el.appendChild(div);
  });
}

function renderHistory(){
  const el=document.getElementById('hist-content'); el.innerHTML='';
  const allKeys=Object.keys(S.days).filter(dk=>{
    const d=S.days[dk];
    return d&&(d.tasks.length||Object.values(d.habitsLog||{}).some(Boolean)||d.mit?.text);
  }).sort().reverse();
  if(!allKeys.length){
    el.innerHTML='<div class="empty-state" style="margin-top:2rem">Ainda sem histórico.<br>Comece pelo dia de hoje!</div>'; return;
  }
  const byMonth={};
  allKeys.forEach(dk=>{
    const d=new Date(dk+'T12:00');
    const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!byMonth[mk])byMonth[mk]=[]; byMonth[mk].push(dk);
  });
  Object.keys(byMonth).sort().reverse().forEach(mk=>{
    const [yr,mo]=mk.split('-');
    const sec=document.createElement('div'); sec.className='hist-month';
    const title=document.createElement('div'); title.className='hist-month-title';
    title.textContent=`${MONTHS[parseInt(mo)-1]} ${yr}`; sec.appendChild(title);
    byMonth[mk].forEach(dk=>{
      const d=new Date(dk+'T12:00'), p=dayProgress(dk), day=S.days[dk];
      const row=document.createElement('div'); row.className='hist-day';
      row.onclick=()=>{viewDate=dk;switchView('day');renderDay();};
      const isToday=dk===realToday;
      row.innerHTML=`<div class="hist-day-label">
          <div class="hist-day-name">${isToday?'✦ Hoje — ':''}${DAYS_PT[d.getDay()]}, ${d.getDate()}</div>
          ${day?.mit?.text?`<div class="hist-day-sub">★ ${day.mit.text}${day.mit.done?' ✓':''}</div>`:''}
        </div>
        <div class="hist-pills">
          ${p.tTotal?`<span class="hp hp-t">${p.tDone}/${p.tTotal}</span>`:''}
          ${p.hDone?`<span class="hp hp-h">${p.hDone}h</span>`:''}
          ${day?.energy!=null?`<span class="hp hp-e">${ENERGY_L[day.energy]}</span>`:''}
        </div>`;
      sec.appendChild(row);
    });
    el.appendChild(sec);
  });
}

function shiftDay(n){ viewDate=dateAdd(viewDate,n); renderDay(); }
function goToday(){ viewDate=realToday; if(currentView!=='day')switchView('day'); else renderDay(); }

function switchView(v){
  currentView=v;
  ['day','week','hist','manif'].forEach(id=>{
    document.getElementById('panel-'+id).classList.toggle('active',id===v);
    const bn=document.getElementById('bnav-'+id);
    if(bn) bn.classList.toggle('active',id===v);
  });
  if(v==='week') renderWeekOverview();
  if(v==='hist') renderHistory();
  if(v==='manif') renderManif();
  document.getElementById('scroll').scrollTop=0;
}

function renderDay(){
  updateTopBar(); renderWeekStrip(); restoreMIT(); restoreIntention();
  restoreEnergy(); renderTasks(viewDate); renderHabits(viewDate); updateRings(viewDate);
  document.getElementById('scroll').scrollTop=0;
  if(currentView!=='day') switchView('day');
}

let fraseAtualIdx = 0;
let temaAtual = 'todas';

function getFrasesDia(){
  // Usa a data para escolher a frase do dia de forma determinística
  const d = new Date(viewDate+'T12:00');
  const seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  return seed % BANCO_FRASES.length;
}

function renderFraseDia(){
  const idx = fraseAtualIdx >= 0 ? fraseAtualIdx : getFrasesDia();
  const f = BANCO_FRASES[idx % BANCO_FRASES.length];
  document.getElementById('frase-do-dia-text').textContent = f.text;
  // check if faved
  const favs = S.manifesto?.favs || [];
  const faved = favs.includes(f.text);
  const btn = document.getElementById('frase-fav-btn');
  btn.textContent = faved ? '♥ favoritada' : '♡ favoritar';
  btn.className = 'manif-fav-btn' + (faved ? ' faved' : '');
}

function proximaFrase(){
  fraseAtualIdx = (fraseAtualIdx + 1) % BANCO_FRASES.length;
  renderFraseDia();
}

function toggleFraseFav(){
  if(!S.manifesto) S.manifesto = {favs:[], afirms:[], dias:{}};
  if(!S.manifesto.favs) S.manifesto.favs = [];
  const idx = fraseAtualIdx >= 0 ? fraseAtualIdx : getFrasesDia();
  const f = BANCO_FRASES[idx % BANCO_FRASES.length];
  const pos = S.manifesto.favs.indexOf(f.text);
  if(pos >= 0) S.manifesto.favs.splice(pos,1); else S.manifesto.favs.push(f.text);
  persist(); renderFraseDia(); renderFavs();
}

let manifTimer;
function saveManif(){
  clearTimeout(manifTimer);
  manifTimer = setTimeout(()=>{
    if(!S.manifesto) S.manifesto = {favs:[],afirms:[],dias:{}};
    if(!S.manifesto.dias) S.manifesto.dias = {};
    S.manifesto.dias[viewDate] = document.getElementById('manif-textarea').value;
    persist();
  }, 500);
}

function restoreManif(){
  const val = S.manifesto?.dias?.[viewDate] || '';
  document.getElementById('manif-textarea').value = val;
}

function addAfirm(){
  const inp = document.getElementById('afirm-inp');
  const v = inp.value.trim(); if(!v) return;
  if(!S.manifesto) S.manifesto = {favs:[],afirms:[],dias:{}};
  if(!S.manifesto.afirms) S.manifesto.afirms = [];
  S.manifesto.afirms.push({text:v, read:false});
  inp.value = ''; persist(); renderAfirms();
}

function toggleAfirm(i){
  S.manifesto.afirms[i].read = !S.manifesto.afirms[i].read;
  persist(); renderAfirms();
}

function removeAfirm(i){
  S.manifesto.afirms.splice(i,1); persist(); renderAfirms();
}

function renderAfirms(){
  const list = document.getElementById('afirm-list');
  const afirms = S.manifesto?.afirms || [];
  const readCount = afirms.filter(a=>a.read).length;
  document.getElementById('afirm-count').textContent = readCount + ' de ' + afirms.length;
  list.innerHTML = '';
  if(!afirms.length){
    list.innerHTML = '<div class="empty-state">Escreva afirmações que resonam com você.</div>'; return;
  }
  afirms.forEach((a,i)=>{
    const card = document.createElement('div');
    card.className = 'afirm-card' + (a.read?' read':'');
    card.innerHTML = `<div class="afirm-check" onclick="toggleAfirm(${i})">${a.read?'✓':''}</div>
      <span class="afirm-text">${a.text}</span>
      <button class="del-btn" onclick="removeAfirm(${i})" style="opacity:0">×</button>`;
    card.querySelector('.del-btn').style.opacity='0';
    card.onmouseenter=()=>card.querySelector('.del-btn').style.opacity='1';
    card.onmouseleave=()=>card.querySelector('.del-btn').style.opacity='0';
    list.appendChild(card);
  });
}

function renderFavs(){
  const list = document.getElementById('fav-list');
  const favs = S.manifesto?.favs || [];
  document.getElementById('fav-count').textContent = favs.length;
  list.innerHTML = '';
  if(!favs.length){
    list.innerHTML = '<div class="empty-state">Favorite frases que te tocam ❤</div>'; return;
  }
  favs.forEach((f,i)=>{
    const card = document.createElement('div');
    card.className = 'fav-card';
    card.innerHTML = `<span class="fav-icon">♥</span>
      <span class="fav-text">${f}</span>
      <button class="fav-del" onclick="removeFav(${i})">×</button>`;
    list.appendChild(card);
  });
}

function removeFav(i){
  S.manifesto.favs.splice(i,1); persist(); renderFavs(); renderFraseDia();
}

function setTema(tema, btn){
  temaAtual = tema;
  document.querySelectorAll('.tema-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderBanco();
}

function addFromBanco(text){
  if(!S.manifesto) S.manifesto = {favs:[],afirms:[],dias:{}};
  if(!S.manifesto.afirms) S.manifesto.afirms = [];
  if(S.manifesto.afirms.some(a=>a.text===text)) return;
  S.manifesto.afirms.push({text, read:false});
  persist(); renderAfirms();
}

function renderBanco(){
  const list = document.getElementById('banco-list');
  const frases = temaAtual==='todas' ? BANCO_FRASES : BANCO_FRASES.filter(f=>f.tema===temaAtual);
  list.innerHTML = '';
  frases.forEach(f=>{
    const card = document.createElement('div');
    card.className = 'banco-card';
    card.innerHTML = `<span class="banco-text">${f.text}</span>
      <button class="banco-add-btn" onclick="addFromBanco('${f.text.replace(/'/g,"\'")}')" title="Adicionar às minhas afirmações">+</button>`;
    list.appendChild(card);
  });
}

function renderManif(){
  fraseAtualIdx = getFrasesDia();
  renderFraseDia();
  restoreManif();
  renderAfirms();
  renderFavs();
  renderBanco();
}

function render(){ renderDay(); }
